<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Wall - جدار الفيديوهات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* شريط التحكم العلوي */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 15px;
            z-index: 9999; /* لضمان ظهوره فوق الفيديوهات */
            transition: opacity 0.3s ease;
        }

        /* زر ملء الشاشة */
        .fullscreen-btn {
            background-color: #ff0000;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .fullscreen-btn:hover {
            background-color: #cc0000;
        }

        /* شبكة الفيديوهات (2x2) */
        .video-wall {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100vw;
            height: 100vh;
        }

        /* حاوية كل فيديو */
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-bar">
        <button class="fullscreen-btn" onclick="toggleFullScreen()">ملء الشاشة ⛶</button>
    </div>

    <!-- جدار الفيديوهات -->
    <div class="video-wall">
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/9pNfCPji3u0?autoplay=1&mute=1&loop=1&playlist=9pNfCPji3u0" 
                    allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/hSPKVHO1Y-w?autoplay=1&mute=1&loop=1&playlist=hSPKVHO1Y-w" 
                    allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/b8oTksd5mV0?autoplay=1&mute=1&loop=1&playlist=b8oTksd5mV0" 
                    allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/h6cB5IUmVF0?autoplay=1&mute=1&loop=1&playlist=h6cB5IUmVF0" 
                    allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <!-- كود الجافاسكربت لتكبير وتصغير الشاشة -->
    <script>
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                // دخول وضع الشاشة الكاملة
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`خطأ أثناء محاولة تكبير الشاشة: ${err.message}`);
                });
            } else {
                // الخروج من وضع الشاشة الكاملة
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
