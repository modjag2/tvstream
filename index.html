<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البث المباشر للقنوات العربية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* حاوية الصفحة الكاملة مرتبة عمودياً */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        /* إخفاء مؤشر الماوس فقط أثناء التكبير وثبات الحركة */
        body.hide-cursor {
            cursor: none;
        }

        /* شريط علوي رفيع وثابت */
        .top-bar {
            height: 35px; /* شريط رفيع جداً */
            background-color: #111;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 9999;
            flex-shrink: 0;
            transition: opacity 0.4s ease, margin-top 0.4s ease;
        }

        /* عنوان الصفحة في الشريط */
        .page-title {
            color: #ddd;
            font-size: 13px;
            font-weight: 500;
        }

        /* زر ملء الشاشة */
        .fullscreen-btn {
            background-color: #ff0000;
            color: #fff;
            border: none;
            padding: 3px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }

        .fullscreen-btn:hover {
            background-color: #cc0000;
        }

        /* حالة إخفاء الشريط فقط أثناء وضع ملء الشاشة */
        .top-bar.fullscreen-hidden {
            margin-top: -35px; /* يسحب الشريط للأعلى ليختفي تماماً */
            opacity: 0;
            pointer-events: none;
        }

        /* شبكة الفيديوهات تحت الشريط */
        .video-wall {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100%;
            height: calc(100vh - 35px);
        }

        /* عند ملء الشاشة تغطي الفيديوهات المساحة كاملة */
        :fullscreen .video-wall {
            height: 100vh;
        }

        /* حاوية كل فيديو */
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- الشريط الرفيع العلوي -->
        <div class="top-bar" id="topBar">
            <div class="page-title">البث المباشر للقنوات العربية</div>
            <button class="fullscreen-btn" onclick="toggleFullScreen(event)">ملء الشاشة ⛶</button>
        </div>

        <!-- جدار الفيديوهات (تحت الشريط) -->
        <div class="video-wall">
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/9pNfCPji3u0?autoplay=1&mute=1&loop=1&playlist=9pNfCPji3u0" 
                        allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>

            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/hSPKVHO1Y-w?autoplay=1&mute=1&loop=1&playlist=hSPKVHO1Y-w" 
                        allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>

            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/b8oTksd5mV0?autoplay=1&mute=1&loop=1&playlist=b8oTksd5mV0" 
                        allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>

            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/h6cB5IUmVF0?autoplay=1&mute=1&loop=1&playlist=h6cB5IUmVF0" 
                        allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const topBar = document.getElementById('topBar');
        let hideTimeout;

        // دالة التكبير والتصغير
        function toggleFullScreen(e) {
            if (e) e.stopPropagation();

            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // تكبير الشاشة عند النقر في أي مكان لأول مرة
        function enableFirstClickFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }
        window.addEventListener('click', enableFirstClickFullscreen, { once: true });

        // التحكم بإخفاء وإظهار الشريط أثناء وضع ملء الشاشة فقط
        function handleMouseMove() {
            // إذا كنا في وضع ملء الشاشة
            if (document.fullscreenElement) {
                topBar.classList.remove('fullscreen-hidden');
                document.body.classList.remove('hide-cursor');

                clearTimeout(hideTimeout);

                // إخفاء الشريط والماوس بعد 3 ثوانٍ من ثبات الماوس
                hideTimeout = setTimeout(() => {
                    topBar.classList.add('fullscreen-hidden');
                    document.body.classList.add('hide-cursor');
                }, 3000);
            } else {
                // في الوضع العادي: الشريط ثابت ومكشوف دوماً
                clearTimeout(hideTimeout);
                topBar.classList.remove('fullscreen-hidden');
                document.body.classList.remove('hide-cursor');
            }
        }

        // الاستماع للتغيير في وضع ملء الشاشة وحركة الماوس
        window.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('fullscreenchange', handleMouseMove);
    </script>

</body>
</html>
