<!doctype html><html lang='ar'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Arial}
#grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:100%}
.cell{position:relative}
iframe{width:100%;height:100%;border:0}
#back{display:none;position:fixed;top:10px;right:10px;z-index:999;padding:10px}
.full{position:fixed!important;inset:0!important;z-index:998;background:#000}
.hide{display:none}
</style></head><body>
<button id='back'>⬅ رجوع</button>
<div id='grid'></div>
<script>
const vids=[
'9pNfCPji3u0','hSPKVHO1Y-w','b8oTksd5mV0','h6cB5IUmVF0'
];
const grid=document.getElementById('grid');
vids.forEach((id,i)=>{
 let c=document.createElement('div');c.className='cell';
 c.innerHTML=`<iframe allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen
 src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0"></iframe>`;
 c.onclick=()=>openOne(i);
 grid.appendChild(c);
});
const cells=[...document.querySelectorAll('.cell')];
function openOne(i){
 cells.forEach((c,n)=>{c.classList.toggle('hide',n!==i);c.classList.toggle('full',n===i)});
 document.getElementById('back').style.display='block';
}
back.onclick=()=>{
 cells.forEach(c=>{c.classList.remove('hide','full')});
 back.style.display='none';
}
</script></body></html>
