<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البث المباشر للقنوات الإخبارية</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#111;
    color:#fff;
}

header{
    background:#1d1d1d;
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    border-bottom:3px solid #d60000;
}

.container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    padding:20px;
}

.channel{
    background:#1b1b1b;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,.4);
}

.channel h2{
    background:#d60000;
    text-align:center;
    padding:12px;
    font-size:20px;
}

.player{
    position:relative;
    width:100%;
    padding-bottom:56.25%;
}

.player iframe{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    border:none;
}

@media(max-width:900px){
    .container{
        grid-template-columns:1fr;
    }
}
</style>

</head>
<body>

<header>
البث المباشر للقنوات الإخبارية
</header>

<div class="container">

<div class="channel">
<h2>قناة المملكة</h2>
<div class="player">
<iframe
src="https://www.youtube.com/embed/9pNfCPji3u0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>
</div>
</div>

<div class="channel">
<h2>قناة الغد</h2>
<div class="player">
<iframe
src="https://www.youtube.com/embed/hSPKVHO1Y-w"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>
</div>
</div>

<div class="channel">
<h2>الإخبارية السورية</h2>
<div class="player">
<iframe
src="https://www.youtube.com/embed/b8oTksd5mV0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>
</div>
</div>

<div class="channel">
<h2>تلفزيون سوريا</h2>
<div class="player">
<iframe
src="https://www.youtube.com/embed/h6cB5IUmVF0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>
</div>
</div>

</div>

</body>
</html>
