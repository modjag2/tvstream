<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البث المباشر للقنوات العربية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* حاوية الصفحة الكاملة مرتبة عمودياً */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        /* إخفاء مؤشر الماوس فقط أثناء التكبير وثبات الحركة */
        body.hide-cursor {
            cursor: none;
        }

        /* شريط علوي رفيع وثابت = */
        .top-bar {
            height: 38px;
            background-color: #111;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            z-index: 9999;
            flex-shrink: 0;
            transition: opacity 0.4s ease, margin-top 0.4s ease;
            gap: 10px;
        }

        /* القنوات في الشريط العلوي مع تأثير الـ Fade للتمرير */
        .channels-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none; /* إخفاء شريط التمرير */
            -webkit-overflow-scrolling: touch; /* تمرير سلس للموبايل */
            
            /* تأثير التلاشي التدريجي في الطرف لإظهار امتداد القنوات */
            mask-image: linear-gradient(to left, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);
            padding-left: 15px; /* مساحة للتلاشي في جهة يسار الشريط */
        }
        
        .channels-selector::-webkit-scrollbar {
            display: none;
        }

        .channel-option {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #ccc;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0; /* يمنع انكماش النص على الموبايل */
        }

        .channel-option input[type="checkbox"] {
            cursor: pointer;
            accent-color: #ff0000;
        }

        /* زر ملء الشاشة */
        .fullscreen-btn {
            background-color: #ff0000;
            color: #fff;
            border: none;
            padding: 3px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
            transition: background-color 0.2s;
        }

        .fullscreen-btn:hover {
            background-color: #cc0000;
        }

        /* حالة إخفاء الشريط فقط أثناء وضع ملء الشاشة */
        .top-bar.fullscreen-hidden {
            margin-top: -38px;
            opacity: 0;
            pointer-events: none;
        }

        /* شبكة الفيديوهات تحت الشريط */
        .video-wall {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            width: 100%;
            height: calc(100vh - 38px);
            gap: 2px;
            background-color: #000;
        }

        /* عند ملء الشاشة تغطي الفيديوهات المساحة كاملة */
        :fullscreen .video-wall {
            height: 100vh;
        }

        /* حاوية كل فيديو */
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- الشريط الرفيع العلوي -->
        <div class="top-bar" id="topBar">
            <div class="channels-selector" id="channelsSelector">
                <!-- سيتم توليد القنوات والـ Checkboxes هنا تلقائياً -->
            </div>
            <button class="fullscreen-btn" onclick="toggleFullScreen(event)">ملء الشاشة ⛶</button>
        </div>

        <!-- جدار الفيديوهات (تحت الشريط) -->
        <div class="video-wall" id="videoWall">
            <!-- سيتم توليد إطارات الفيديوهات المختارة فقط هنا -->
        </div>
    </div>

    <script>
        // مفتاح الـ API
        const API_KEY = "AIzaSyBq_8zwgboE1u6Q4BXz--yU86-9Kqc-3Vo";

        // قائمة القنوات المتاحة مرتبة
        const channelList = [
            { id: "alghad", name: "الغد", channelId: "UCH4UNKBHSNwstan99YDoCVg", defaultChecked: true },
            { id: "syria_news", name: "الإخبارية السورية", channelId: "UClm30t2F4FHzzkN9Irtr-8A", defaultChecked: true },
            { id: "al_mamlaka", name: "المملكة", channelId: "UC0jiFAzTgl17k7awGbuoYew", defaultChecked: true },
            { id: "syria_tv", name: "تلفزيون سوريا", channelId: "UCJsZ22yL1IW0R2u0jnnyYog", defaultChecked: true },
            { id: "aljazeera", name: "الجزيرة", channelId: "UCfiwzLy-8yKzIbsmZTzxDgw", defaultChecked: false },
            { id: "alarabiya", name: "العربية", channelId: "UCahpxixMCwoANAftn6IxkTg", defaultChecked: false },
            { id: "alhadath", name: "الحدث", channelId: "UCrj5BGAhtWxDfqbza9T9hqA", defaultChecked: false },
            { id: "ekhbariya_sa", name: "الإخبارية السعودية", channelId: "UCV01ajGl6nt09h40iDoHDNg", defaultChecked: false },
            { id: "shams", name: "شمس", channelId: "UCO9kL7zKW0xINGqcX8yXOZw", defaultChecked: false }
        ];

        // تخزين روابط البث المجلوبة لتفادي تكرار طلبات الـ API
        const videoCache = {};

        // بناء قائمة القنوات في الشريط العلوي
        function initChannelsMenu() {
            const container = document.getElementById("channelsSelector");
            container.innerHTML = "";

            channelList.forEach(ch => {
                const label = document.createElement("label");
                label.className = "channel-option";
                
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = ch.defaultChecked;
                checkbox.value = ch.id;
                checkbox.onchange = updateVideoWall;

                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(ch.name));
                container.appendChild(label);
            });
        }

        // جلب معرف البث من API يوتيوب
        async function fetchLiveVideoId(channelId) {
            if (videoCache[channelId]) return videoCache[channelId];

            let url = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${channelId}&eventType=live&type=video&key=${API_KEY}`;
            
            try {
                let response = await fetch(url);
                let data = await response.json();
                let videoId = null;

                if (data.items && data.items.length > 0) {
                    videoId = data.items[0].id.videoId;
                } else {
                    let latestUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${channelId}&order=date&type=video&maxResults=1&key=${API_KEY}`;
                    let latestResponse = await fetch(latestUrl);
                    let latestData = await latestResponse.json();
                    if (latestData.items && latestData.items.length > 0) {
                        videoId = latestData.items[0].id.videoId;
                    }
                }

                if (videoId) {
                    videoCache[channelId] = videoId;
                }
                return videoId;
            } catch (error) {
                console.error("خطأ في جلب القناة:", channelId, error);
                return null;
            }
        }

        // تحديث شبكة الفيديوهات المعروضة بناءً على المربعات المحددة
        async function updateVideoWall() {
            const wall = document.getElementById("videoWall");
            const checkboxes = document.querySelectorAll('#channelsSelector input[type="checkbox"]:checked');
            const selectedChannelIds = Array.from(checkboxes).map(cb => cb.value);

            const selectedChannels = channelList.filter(ch => selectedChannelIds.includes(ch.id));

            // تعديل توزيع الشبكة (Grid) تلقائياً بحسب عدد القنوات
            const count = selectedChannels.length;
            if (count === 1) {
                wall.style.gridTemplateColumns = "1fr";
                wall.style.gridTemplateRows = "1fr";
            } else if (count === 2) {
                wall.style.gridTemplateColumns = "1fr 1fr";
                wall.style.gridTemplateRows = "1fr";
            } else if (count <= 4) {
                wall.style.gridTemplateColumns = "1fr 1fr";
                wall.style.gridTemplateRows = "1fr 1fr";
            } else {
                wall.style.gridTemplateColumns = "repeat(3, 1fr)";
                wall.style.gridTemplateRows = "repeat(" + Math.ceil(count / 3) + ", 1fr)";
            }

            wall.innerHTML = "";

            for (const ch of selectedChannels) {
                const container = document.createElement("div");
                container.className = "video-container";

                const iframe = document.createElement("iframe");
                iframe.allow = "autoplay; encrypted-media";
                iframe.allowFullscreen = true;

                container.appendChild(iframe);
                wall.appendChild(container);

                // جلب الفيديو وتضمينه
                fetchLiveVideoId(ch.channelId).then(videoId => {
                    if (videoId) {
                        iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}`;
                    }
                });
            }
        }

        // التشغيل عند الفتح
        window.addEventListener('DOMContentLoaded', () => {
            initChannelsMenu();
            updateVideoWall();
        });

        // --- التحكم في الشريط وملء الشاشة ---
        const topBar = document.getElementById('topBar');
        let hideTimeout;

        function toggleFullScreen(e) {
            if (e) e.stopPropagation();

            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function enableFirstClickFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }
        window.addEventListener('click', enableFirstClickFullscreen, { once: true });

        function handleMouseMove() {
            if (document.fullscreenElement) {
                topBar.classList.remove('fullscreen-hidden');
                document.body.classList.remove('hide-cursor');

                clearTimeout(hideTimeout);

                hideTimeout = setTimeout(() => {
                    topBar.classList.add('fullscreen-hidden');
                    document.body.classList.add('hide-cursor');
                }, 3000);
            } else {
                clearTimeout(hideTimeout);
                topBar.classList.remove('fullscreen-hidden');
                document.body.classList.remove('hide-cursor');
            }
        }

        window.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('fullscreenchange', handleMouseMove);
    </script>

</body>
</html>
