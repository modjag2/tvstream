<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البث المباشر للقنوات العربية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* الماوس يختفي مع إخفاء الشريط لتجربة مشاهدة كاملة */
        body.hide-cursor {
            cursor: none;
        }

        /* شريط التحكم العلوي */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0));
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        /* إخفاء الشريط */
        .top-bar.hidden {
            opacity: 0;
            pointer-events: none; /* لمنع النقر عليه وهو مخفي */
        }

        /* عنوان الصفحة في الشريط العلوي */
        .page-title {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* زر ملء الشاشة */
        .fullscreen-btn {
            background-color: #ff0000;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }

        .fullscreen-btn:hover {
            background-color: #cc0000;
            transform: scale(1.03);
        }

        /* شبكة الفيديوهات (2x2) */
        .video-wall {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100vw;
            height: 100vh;
        }

        /* حاوية كل فيديو */
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-bar" id="topBar">
        <div class="page-title">البث المباشر للقنوات العربية</div>
        <button class="fullscreen-btn" onclick="toggleFullScreen()">ملء الشاشة ⛶</button>
    </div>

    <!-- جدار الفيديوهات -->
    <div class="video-wall">
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/9pNfCPji3u0?autoplay=1&mute=1&loop=1&playlist=9pNfCPji3u0" 
                    allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/hSPKVHO1Y-w?autoplay=1&mute=1&loop=1&playlist=hSPKVHO1Y-w" 
                    allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/b8oTksd5mV0?autoplay=1&mute=1&loop=1&playlist=b8oTksd5mV0" 
                    allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/h6cB5IUmVF0?autoplay=1&mute=1&loop=1&playlist=h6cB5IUmVF0" 
                    allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <!-- كود الجافاسكربت للتفاعل وتوقيت الإخفاء -->
    <script>
        const topBar = document.getElementById('topBar');
        let hideTimeout;

        // وظيفة إظهار الشريط ورست مؤقت الإخفاء
        function showTopBar() {
            topBar.classList.remove('hidden');
            document.body.classList.remove('hide-cursor');

            clearTimeout(hideTimeout);
            
            // إخفاء الشريط والماوس بعد 3 ثوانٍ من التوقف عن الحركة
            hideTimeout = setTimeout(() => {
                topBar.classList.add('hidden');
                document.body.classList.add('hide-cursor');
            }, 3000);
        }

        // الاستماع لحركة الماوس
        window.addEventListener('mousemove', showTopBar);
        window.addEventListener('click', showTopBar);

        // بدء المؤقت عند فتح الصفحة
        showTopBar();

        // وظيفة تكبير وتصغير الشاشة
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`خطأ أثناء محاولة تكبير الشاشة: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
