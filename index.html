<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>البث المباشر للقنوات الإخبارية</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#111;
    color:#fff;
}

header{
    background:#1c1c1c;
    padding:20px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    border-bottom:4px solid #d60000;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
    gap:20px;
    padding:20px;
}

.channel{
    background:#1b1b1b;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 15px rgba(0,0,0,.5);
    transition:.3s;
}

.channel:hover{
    transform:translateY(-3px);
}

.channel h2{
    background:#d60000;
    padding:12px;
    text-align:center;
    font-size:20px;
}

.player{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
}

.player iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
}

@media(max-width:768px){
    .container{
        grid-template-columns:1fr;
    }

    header{
        font-size:24px;
    }
}
</style>

</head>

<body>

<header>
البث المباشر للقنوات الإخبارية
</header>

<div class="container">

    <!-- المملكة -->
    <div class="channel">
        <h2>قناة المملكة</h2>
        <div class="player">
            <iframe
                src="https://www.youtube.com/embed/9pNfCPji3u0?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- الغد -->
    <div class="channel">
        <h2>قناة الغد</h2>
        <div class="player">
            <iframe
                src="https://www.youtube.com/embed/hSPKVHO1Y-w?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- الإخبارية السورية -->
    <div class="channel">
        <h2>الإخبارية السورية</h2>
        <div class="player">
            <iframe
                src="https://www.youtube.com/embed/b8oTksd5mV0?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- تلفزيون سوريا -->
    <div class="channel">
        <h2>تلفزيون سوريا</h2>
        <div class="player">
            <iframe
                src="https://www.youtube.com/embed/h6cB5IUmVF0?autoplay=1&mute=1&playsinline=1&rel=0"
                allow="autoplay; encrypted-media; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </div>

</div>

</body>
</html>
