<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Wall - جدار الفيديوهات</title>
    <style>
        /* إزالة الحواف والفراغات من الصفحة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* لمنع شريط التمرير */
            background-color: #000;
        }

        /* شبكة الفيديوهات (2x2) */
        .video-wall {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100vw;
            height: 100vh;
        }

        /* حاوية كل فيديو */
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* إعدادات الـ iframe لتغطية المساحة بالكامل بدون فواصل */
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none; /* إزالة الحدود */
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="video-wall">
        <!-- الفيديو الأول -->
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/9pNfCPji3u0?autoplay=1&mute=1&loop=1&playlist=9pNfCPji3u0" 
                    allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <!-- الفيديو الثاني -->
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/hSPKVHO1Y-w?autoplay=1&mute=1&loop=1&playlist=hSPKVHO1Y-w" 
                    allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <!-- الفيديو الثالث -->
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/b8oTksd5mV0?autoplay=1&mute=1&loop=1&playlist=b8oTksd5mV0" 
                    allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <!-- الفيديو الرابع -->
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/h6cB5IUmVF0?autoplay=1&mute=1&loop=1&playlist=h6cB5IUmVF0" 
                    allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
