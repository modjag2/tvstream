<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شاشة البث المباشر الرباعية</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* شبكة التقسيم إلى 4 أقسام (2x2) */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100vw;
      height: 100vh;
      gap: 3px; /* سمك خط الفاصل الإيجابي (+) */
      background-color: #222; /* لون الفواصل بين الفيديوهات */
    }

    .video-card {
      width: 100%;
      height: 100%;
      position: relative;
      background-color: #000;
    }

    .video-card iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <!-- قناة المملكة -->
    <div class="video-card">
      <iframe 
        src="https://www.youtube.com/embed/live_stream?channel=AlMamlakaTV" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>

    <!-- قناة الغد Extra -->
    <div class="video-card">
      <iframe 
        src="https://www.youtube.com/embed/live_stream?channel=AlghadExtra" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>

    <!-- قناة الإخبارية السعودية -->
    <div class="video-card">
      <iframe 
        src="https://www.youtube.com/embed/live_stream?channel=SaudiNewsTV" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>

    <!-- قناة الإخبارية السورية -->
    <div class="video-card">
      <iframe 
        src="https://www.youtube.com/embed/live_stream?channel=AlekhbariahSY" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>
  </div>

</body>
</html>
